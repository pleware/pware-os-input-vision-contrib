name: build

# Builds telemetry-free mediapipe wheels from the pinned Apache-2.0 source.
on:
  workflow_dispatch:

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: python -m pip install --upgrade setuptools wheel

      # mediapipe builds OpenCV from source (--define=OPENCV=source), and that
      # foreign_cc CMake build links system codecs: jpeg/png/tiff/openexr/
      # dc1394/ffmpeg. Without the -dev packages the compiler ABI probe fails.
      - name: Install OpenCV system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libjpeg-dev libpng-dev libtiff-dev libopenexr-dev libdc1394-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      # bazelisk reads the pinned version from mediapipe's .bazelversion
      # (7.4.1), which matches pware-os-workspace/mise.toml — one pin, two
      # consumers. Local devs get it via `ignite bootstrap`; CI via bazelisk.
      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true

      # Two Bazel flags in our own LF-ending rc:
      # - --noenable_bzlmod: mediapipe v0.10.35 is WORKSPACE-only; its own
      #   .bazelrc sets this, but a CRLF checkout on Windows breaks that line
      #   and leaves bzlmod on, which then cannot see WORKSPACE repos
      #   ("No repository visible as '@flatbuffers'"). Setting it again here,
      #   in a file we write with LF endings, is the robust fix.
      # - --jobs=4: the runner is 4-core; mediapipe's .bazelrc asks for 128.
      - name: Set Bazel flags (disable bzlmod, cap jobs)
        run: printf 'common --noenable_bzlmod\nbuild --jobs=4\n' > ~/.bazelrc
        shell: bash

      - name: Checkout pinned mediapipe source
        run: bash scripts/checkout.sh
        shell: bash

      - name: Build wheel
        run: python setup.py bdist_wheel
        working-directory: mediapipe-src

      - uses: actions/upload-artifact@v4
        with:
          name: mediapipe-${{ matrix.os }}
          path: mediapipe-src/dist/*.whl
