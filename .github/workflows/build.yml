name: build

# Builds telemetry-free mediapipe wheels from the pinned Apache-2.0 source, and
# refuses to publish one that carries Google's clearcut uploader.
#
# Two jobs, one artifact each: the wheel, and the scan manifest that says what
# was inside it. The scan is a gate, not a report — a dirty wheel fails the run
# before anything is uploaded (`scripts/scan-wheel.py`).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the wheels to a GitHub release"
        type: boolean
        default: false
      only:
        description: "Build one leg instead of both"
        type: choice
        options: [all, windows, linux]
        default: all
  push:
    tags: ["v*"]

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: setup.py drives bazel (`--define=OPENCV=source`), and the
          # runner already carries MSVC. mediapipe 1.0.0 disables the GPU path
          # itself unless MEDIAPIPE_DISABLE_GPU=0, which is what a box wants.
          - os: windows-latest
            leg: windows
            run: python setup.py bdist_wheel
          # Linux: the same entry point, with the system codec headers the
          # foreign_cc OpenCV build probes for. Upstream's own manylinux path
          # (`build_manylinux_wheel.sh` + `Dockerfile.manylinux_2_28_x86_64`) is
          # the next step for a distributable manylinux-tagged wheel; the box
          # runs Debian x86_64, where this wheel installs as built.
          - os: ubuntu-latest
            leg: linux
            run: python setup.py bdist_wheel
    if: github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == matrix.leg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: python -m pip install --upgrade setuptools wheel

      # mediapipe builds OpenCV from source (--define=OPENCV=source), and that
      # foreign_cc CMake build links system codecs: jpeg/png/tiff/openexr/
      # dc1394/ffmpeg. Without the -dev packages the compiler ABI probe fails.
      - name: Install OpenCV system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libjpeg-dev libpng-dev libtiff-dev libopenexr-dev libdc1394-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev

      # The pinned binary, downloaded and put first on PATH — upstream's own
      # method (their `Dockerfile.manylinux_2_28_x86_64` curls
      # `bazel-7.4.1-linux-x86_64` into /usr/local/bin).
      #
      # Not bazelisk, and not an action that installs it: on the Windows runner a
      # bare `bazel` from setup.py resolved to the *image's own* bazel — 9.2.0 —
      # whatever `USE_BAZEL_VERSION` or `.bazelversion` said. From bazel 8 on
      # WORKSPACE is off by default, and mediapipe's `@flatbuffers` is defined
      # only in its WORKSPACE (`third_party/flatbuffers:workspace.bzl`), so the
      # build died on `No repository visible as '@flatbuffers'` — the same error
      # that killed all five runs of 2026-09-12. The 0.10.35-era
      # `--noenable_bzlmod` workaround treated that symptom and could never have
      # fixed it. 7.4.1 is mediapipe's own `.bazelversion` and the version
      # pware-os-workspace/mise.toml pins — one version, two consumers.
      - name: Install the pinned Bazel (7.4.1, by hand)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) asset=bazel-7.4.1-windows-x86_64.exe; bin=bazel.exe ;;
            Linux)   asset=bazel-7.4.1-linux-x86_64;      bin=bazel ;;
            *) echo "unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/pinned-bazel"
          mkdir -p "$dir"
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
            -o "$dir/$bin" \
            "https://github.com/bazelbuild/bazel/releases/download/7.4.1/$asset"
          chmod +x "$dir/$bin" || true
          echo "$dir" >> "$GITHUB_PATH"

      # Assert what a bare `bazel` resolves to, and where it lives — the failure
      # this guards against was invisible from the version string alone (the
      # first fix pinned the version and the build still used the image's bazel).
      - name: Assert the pinned Bazel
        shell: bash
        run: |
          which -a bazel || true
          v=$(bazel --version | awk '{print $2}')
          if [ "$v" != "7.4.1" ]; then
            echo "bazel $v, want 7.4.1: from bazel 8 on, WORKSPACE is off by" >&2
            echo "default and mediapipe's @flatbuffers lives only there." >&2
            exit 1
          fi
          echo "bazel $v"

      # mediapipe's .bazelrc asks bazel for `--jobs 1` (and turns bzlmod on,
      # which v1.0.0 relies on — no `--noenable_bzlmod` here: that flag was the
      # 0.10.35-era workaround and the cause of five dead runs). Cap the jobs at
      # the runner's core count instead of upstream's serial default.
      - name: Cap Bazel jobs at the runner's cores
        run: printf 'build --jobs=%s\n' "$(nproc 2>/dev/null || echo 4)" > ~/.bazelrc
        shell: bash

      - name: Checkout pinned mediapipe source
        run: bash scripts/checkout.sh

      - name: Build wheel
        run: ${{ matrix.run }}
        working-directory: mediapipe-src

      # The point of the whole repository: the artifact must carry none of the
      # markers Google's own wheels carry. Fails the run, so nothing dirty is
      # ever uploaded.
      - name: Scan the wheel for the uploader (gate)
        run: python scripts/scan-wheel.py --dir mediapipe-src/dist > telemetry-scan.json

      - uses: actions/upload-artifact@v4
        with:
          name: mediapipe-${{ matrix.os }}
          path: |
            mediapipe-src/dist/*.whl
            telemetry-scan.json

  release:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      # What the box installs has to be verifiable after the fact, so the
      # checksums ship beside the wheels.
      - name: Checksums
        run: |
          cd wheels
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wheels/*.whl
            wheels/SHA256SUMS
            wheels/telemetry-scan.json
          # A tag build names its own release; a manual one needs a name, so it
          # attaches to the tag if there is one and otherwise to a draft named
          # for the pinned version.
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          name: mediapipe ${{ github.ref_name }}
