name: build

# Builds telemetry-free mediapipe wheels from the pinned Apache-2.0 source.
on:
  workflow_dispatch:

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: python -m pip install --upgrade setuptools wheel

      # bazelisk reads the pinned version from mediapipe's .bazelversion
      # (7.4.1), which matches pware-os-workspace/mise.toml — one pin, two
      # consumers. Local devs get it via `ignite bootstrap`; CI via bazelisk.
      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true

      - name: Cap Bazel parallelism (CI is 4-core)
        run: echo "build --jobs=4" > ~/.bazelrc
        shell: bash

      - name: Checkout pinned mediapipe source
        run: bash scripts/checkout.sh
        shell: bash

      - name: Build wheel
        run: python setup.py bdist_wheel
        working-directory: mediapipe-src

      - uses: actions/upload-artifact@v4
        with:
          name: mediapipe-${{ matrix.os }}
          path: mediapipe-src/dist/*.whl
