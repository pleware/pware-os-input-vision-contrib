name: build

# Builds telemetry-free mediapipe wheels from the pinned Apache-2.0 source, and
# refuses to publish one that carries Google's clearcut uploader.
#
# Each leg is a thin caller of `_wheel.yml` (the recipe) and an artifact: the
# wheel, plus the scan manifest that says what was inside it. The scan is a gate,
# not a report — a dirty wheel fails the run before anything is uploaded
# (`scripts/scan-wheel.py`).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the wheels to a GitHub release"
        type: boolean
        default: false
      only:
        description: "Build one leg instead of both"
        type: choice
        options: [all, windows, linux]
        default: all
  push:
    tags: ["v*"]

jobs:
  # Windows: setup.py drives bazel (`--define=OPENCV=source`), and the runner
  # carries MSVC. mediapipe 1.0.0 disables the GPU path itself unless
  # MEDIAPIPE_DISABLE_GPU=0, which is what a box wants. This leg needs the Swift
  # stub — see `_wheel.yml`.
  wheel-windows:
    if: ${{ !github.event.inputs.only || github.event.inputs.only == 'all' || github.event.inputs.only == 'windows' }}
    uses: ./.github/workflows/_wheel.yml
    with:
      os: windows-latest
      run: python setup.py bdist_wheel

  # Linux: the same entry point, with the system codec headers the foreign_cc
  # OpenCV build probes for. Upstream's own manylinux path
  # (`build_manylinux_wheel.sh` + `Dockerfile.manylinux_2_28_x86_64`) is the next
  # step for a distributable manylinux-tagged wheel — it builds OpenCV *outside*
  # bazel and finishes with `auditwheel repair`. The box runs Debian x86_64,
  # where this wheel installs as built (tag `linux_x86_64`).
  wheel-linux:
    if: ${{ !github.event.inputs.only || github.event.inputs.only == 'all' || github.event.inputs.only == 'linux' }}
    uses: ./.github/workflows/_wheel.yml
    with:
      os: ubuntu-latest
      run: python setup.py bdist_wheel

  release:
    needs: [wheel-windows, wheel-linux]
    # `always()` because a leg that was not asked for is *skipped*, and a skipped
    # dependency would otherwise skip the release too — while a leg that was
    # asked for and failed must never publish, so every requested leg has to be
    # green. Publishing also requires both legs: one wheel in a release labelled
    # with the version would be worse than no release.
    if: >-
      always() && !cancelled()
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (!github.event.inputs.only || github.event.inputs.only == 'all')
      && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      # What the box installs has to be verifiable after the fact, so the
      # checksums ship beside the wheels.
      - name: Checksums
        run: |
          cd wheels
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wheels/*.whl
            wheels/SHA256SUMS
            wheels/telemetry-scan.json
          # A tag build names its own release; a manual one needs a name, so it
          # attaches to the tag if there is one and otherwise to a draft named
          # for the pinned version.
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          name: mediapipe ${{ github.ref_name }}
